<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b101a">
  <title>Вход · RKO Radar</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand large"><div class="brand-symbol">R<span>↗</span></div><div><strong>RKO Radar</strong><small>Панель поиска запросов</small></div></div>
    <h1>С возвращением</h1>
    <p class="muted">Для безопасности войди с паролем RKO Radar.</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="password">Пароль панели</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required autofocus placeholder="Пароль RKO Radar">
      <label class="remember-device" for="remember_device">
        <input id="remember_device" type="checkbox" name="remember_device" value="yes" checked>
        <span><strong>Запомнить это устройство</strong><small>Не спрашивать пароль до 30 дней. Только на личном телефоне.</small></span>
      </label>
      <button class="btn btn-primary full" type="submit">Войти в панель →</button>
    </form>
    <div class="login-foot">При выходе из аккаунта запоминание прекращается. Доступ защищён HTTPS.</div>
  </main>
</body>
</html>
